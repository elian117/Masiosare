<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASIOSARE AI LAYER 2</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>MASIOSARE AI LAYER 2</h1>
            <p>Haz preguntas sobre tu base de datos en lenguaje natural</p>
        </div>
        <button class="btn-clear" onclick="clearHistory()">
            <i class="fas fa-trash"></i> Borrar historial
        </button>
    </header>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <div class="welcome-message">
            <div class="welcome-icon"></div>
            <h2>¡Bienvenido a MASIOSARE!</h2>
            <p>Pregúntame lo que quieras sobre la base de datos. ¡Recordaré nuestra conversación!</p>
            
            <!-- 
            <div class="memory-info">
                <p>💡 <strong>Memoria activada:</strong> puedo hacer referencia a consultas previas y mantener el contexto durante la conversación.</p>
            </div>
            -->

            <div class="example-queries">
                <p><strong>Prueba preguntando:</strong></p>
                <button class="example-btn" onclick="sendExample('¿Cuántos productos hay en cada categoría?')">
                    ¿Cuántos productos hay en cada categoría?
                </button>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="messageInput" 
                placeholder="Haz una pregunta sobre la base de datos..."
                rows="1"
                onkeydown="handleKeyPress(event)"
            ></textarea>
            <button class="btn-send" onclick="sendMessage()" id="sendButton">
                <span id="sendIcon"><i class="fas fa-paper-plane"></i></span>
                <span id="sendText">Enviar</span>
            </button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
